name: Inspect pinned Pixel package layout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install read-only image tools
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs aapt
      - name: Inspect checksum-verified factory package layout
        run: python3 tools/pixel/inspect_factory_layout.py docs/A17-UPSTREAM.json layout-evidence
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pixel-layout-evidence
          path: layout-evidence/
          if-no-files-found: error
