name: Inspect pinned runtime budget watcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Extract checksum-verified runtime budget code for host analysis
        run: |
          mkdir runtime-budget-evidence
          python3 - <<'PYEXTRACT'
          import hashlib, json, shutil, subprocess, urllib.request, zipfile
          from pathlib import Path
          pins = json.loads(Path('docs/A17-UPSTREAM.json').read_text())['gsi']
          urllib.request.urlretrieve(pins['url'], 'gsi.zip')
          digest = hashlib.file_digest(open('gsi.zip', 'rb'), 'sha256').hexdigest()
          assert digest == pins['sha256'], 'GSI checksum mismatch'
          Path('runtime-budget-evidence/input.json').write_text(json.dumps(pins, indent=2))
          with zipfile.ZipFile('gsi.zip') as z:
              matches = [n for n in z.namelist() if Path(n).name == 'system.img']
              assert len(matches) == 1, matches
              with z.open(matches[0]) as src, open('system.img', 'wb') as dst:
                  shutil.copyfileobj(src, dst)
          assert open('system.img', 'rb').read(4) != bytes.fromhex('3aff26ed'), 'Sparse input'
          target = 'runtime-budget-evidence/libandroid_runtime.so'
          result = subprocess.run(['debugfs', '-R', f'dump /system/lib64/libandroid_runtime.so {target}', 'system.img'], capture_output=True, text=True, check=True)
          assert Path(target).stat().st_size > 0
          Path(target + '-extract.txt').write_text(result.stdout + result.stderr)
          PYEXTRACT
          sha256sum runtime-budget-evidence/*.so > runtime-budget-evidence/SHA256SUMS
          readelf -Ws runtime-budget-evidence/libandroid_runtime.so > runtime-budget-evidence/symbols.txt
          readelf -S -W runtime-budget-evidence/libandroid_runtime.so > runtime-budget-evidence/sections.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: runtime-budget-evidence
          path: runtime-budget-evidence/
          if-no-files-found: error
